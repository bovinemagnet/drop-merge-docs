name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Antora site
        run: npm run docs:build

      - name: Generate GitHub Wiki pages
        run: npm run wiki:generate

      - name: Upload Antora site artifact
        uses: actions/upload-artifact@v4
        with:
          name: antora-site
          path: build/site

      - name: Upload GitHub Wiki artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-wiki
          path: build/wiki

      # Publishes generated wiki pages to the repository .wiki Git repo.
      # Runs on push to main and manual dispatch, but never on pull requests.
      - name: Publish GitHub Wiki
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-repo
          rm -rf wiki-repo/*
          cp -R build/wiki/. wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to publish."
          else
            git commit -m "docs: sync wiki content"
            git push
          fi
