name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Antora site
        run: npm run docs:build

      - name: Generate GitHub Wiki pages
        run: npm run wiki:generate

      - name: Upload Antora site artifact
        uses: actions/upload-artifact@v4
        with:
          name: antora-site
          path: build/site

      - name: Upload GitHub Wiki artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-wiki
          path: build/wiki

